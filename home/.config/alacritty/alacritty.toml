
[[colors.indexed_colors]]
color = "#e0b089"
index = 16

[[colors.indexed_colors]]
color = "#bfc9db"
index = 17

[colors.bright]
black = "0x988BA2"
blue = "0x96CDFB"
cyan = "0x89DCEB"
green = "0xABE9B3"
magenta = "0xF5C2E7"
red = "0xF28FAD"
white = "#d2d3c9"
yellow = "0xFAE3B0"

[colors.normal]
black = "#1a1826"
blue = "#a1bdce"
cyan = "#a1bdce"
green = "#afbea2"
magenta = "#c98bbf"
red = "#d78787"
white = "#b1b9c7"
yellow = "#e4c9af"

[colors.primary]
background = "#0f0f17"
foreground = "#bfc9db"

# cursor in the red accent; the letter under it shows in the background colour
[colors.cursor]
cursor = "#c55449"
text = "#0f0f17"

# a thin blinking bar instead of a block
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600
# keep blinking (by default it stops after 5 seconds of no typing)
blink_timeout = 0

[font]
size = 12

[font.normal]
#family = "Source Code Pro"
family = "Iosevka"
style = "regular"

[window]
# fully opaque (0.5 was never visible under bspwm, which had no working compositor)
opacity = 1.0

[window.padding]
#dynamic_padding = false
x = 20
y = 10

[general]
live_config_reload = true

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
