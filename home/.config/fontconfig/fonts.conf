<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Default fonts: any app that asks for a generic font (normal text, serif,
  fixed-width or the interface font) gets Iosevka instead of FreeSans etc.
  Firefox is left out and keeps the fonts it had before (see the end).
  Check with: fc-match sans-serif
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname" compare="not_eq"><string>firefox</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Iosevka</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="not_eq"><string>firefox</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Iosevka</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="not_eq"><string>firefox</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Iosevka</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="not_eq"><string>firefox</string></test>
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Iosevka</string></edit>
  </match>

  <!-- Firefox's menus and tabs follow the GTK interface font (Iosevka 11,
       set with gsettings); give them back the one they had before. -->
  <match target="pattern">
    <test name="prgname"><string>firefox</string></test>
    <test name="family"><string>Iosevka</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Adwaita Sans</string></edit>
  </match>
</fontconfig>
