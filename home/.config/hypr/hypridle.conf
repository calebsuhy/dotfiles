# Autolocker (was: xautolock -time 5 -locker "betterlockscreen -l dimblur").
general {
    # avoid starting multiple hyprlock instances
    lock_cmd = pidof hyprlock || hyprlock
    # lock before suspend
    before_sleep_cmd = loginctl lock-session
}

# warn 30 seconds before locking (after 4.5 minutes idle); the warning goes
# away as soon as you move the mouse or press a key
listener {
    timeout = 270
    on-timeout = ~/.config/hypr/autolock-warning.sh show
    on-resume = ~/.config/hypr/autolock-warning.sh hide
}

# lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
