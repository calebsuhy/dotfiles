# Lock screen (was betterlockscreen -l dimblur, themed in
# ~/.config/betterlockscreen/betterlockscreenrc): blurred, dimmed screenshot
# of the desktop, white clock and date centred, password field below them,
# the song playing in Spotify near the bottom, red accents.

general {
    hide_cursor = true
}

# fade in when locking and out when unlocking, 0.25s like the window
# animations; nothing else on the lock screen animates
animations {
    enabled = true
    bezier = easeOut, 0.25, 1, 0.5, 1
    animation = global, 0
    animation = fade, 1, 2.5, easeOut
}

# dimblur: the desktop blurred and darkened (dim_level=40)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# clock, size 64, centre of the screen (time_format="%I:%M %p")
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgb(FFFFFF)
    font_size = 64
    font_family = Iosevka
    position = 0, 110
    halign = center
    valign = center
}

# date under the clock, e.g. "Wednesday, October 14", slightly dimmer
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.7)
    font_size = 20
    font_family = Iosevka
    position = 0, 40
    halign = center
    valign = center
}

# the song playing in Spotify ("Artist — Title"), near the bottom; empty
# when nothing is playing (see now-playing.sh)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/now-playing.sh
    color = rgba(255, 255, 255, 0.7)
    font_size = 15
    font_family = Iosevka Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}

# password field below the clock: no box, red outline (ringcolor), white
# while checking (ringvercolor), red-pink when wrong (ringwrongcolor)
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 6
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(C55449)
    check_color = rgb(FFFFFF)
    fail_color = rgb(FF5555)
    font_color = rgb(FFFFFF)
    font_family = Iosevka
    fade_on_empty = false
    placeholder_text = Type password to unlock
    check_text = Checking...
    fail_text = Wrong password
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
