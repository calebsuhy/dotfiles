; Qt app look (qt6ct, used because hyprland.lua sets QT_QPA_PLATFORMTHEME):
; the plain Fusion style in your colours (colors/Casu.conf) with the same
; Papirus-Dark icons as GTK apps. KDE apps such as Dolphin also read
; ~/.config/kdeglobals.
[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=/home/casu/.config/qt6ct/colors/Casu.conf
icon_theme=Papirus-Dark
standard_dialogs=default
