# Blue Yeti: do volume in software instead of with the Yeti's hardware control.
# The hardware control only reaches -40 dB and its bottom step is silent, so
# anything below ~21% volume cut the sound out. With a software mixer the
# hardware stays at full (0 dB) and PipeWire scales the audio smoothly down to
# 0%, at the same loudness per percentage as before.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Blue_Microphones_Yeti_Stereo_Microphone_REV8-00" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
